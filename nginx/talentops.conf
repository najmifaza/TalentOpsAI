# ==============================================================================
# TALENTOPS AI: PRODUCTION NGINX REVERSE PROXY HARDENING CONFIGURATION
# Domain: api-talentops.fawt.biz.id -> Uvicorn Backend (127.0.0.1:8002)
# Dokumen Acuan: PRD_TALENTOPS_AI_MASTER.md Bab 6.1 & PEMBAGIAN_TUGAS_TIM.md
# Target Kepatuhan: SSL Labs Grade A+, Zero-Lag SSE Streaming, DDOS/Abuse Protection
# ==============================================================================

# Rate Limiting Zones (Diatur per Binary IP Address di belakang Reverse Proxy)
limit_req_zone $binary_remote_addr zone=talentops_apply_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=talentops_api_limit:10m rate=30r/s;
limit_req_status 429;

# Upstream dengan Connection Pooling Keep-Alive
upstream talentops_backend_cluster {
    server 127.0.0.1:8002 max_fails=3 fail_timeout=10s;
    keepalive 64;
    keepalive_requests 1000;
    keepalive_timeout 65s;
}

# ------------------------------------------------------------------------------
# 1. HTTP to HTTPS Strict Redirection
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api-talentops.fawt.biz.id;

    # Let's Encrypt ACME Challenge Directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. Production HTTPS Server Block (SSL Labs Grade A+ & Hardened Security)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api-talentops.fawt.biz.id;

    # SSL Certificates (Let's Encrypt Production)
    ssl_certificate /etc/letsencrypt/live/api-talentops.fawt.biz.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-talentops.fawt.biz.id/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/api-talentops.fawt.biz.id/chain.pem;

    # Protocol & Modern Cipher Suites (Grade A+ Mozilla Modern / Intermediate)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    # SSL Session Optimization
    ssl_session_timeout 1d;
    ssl_session_cache shared:TalentOpsSSL:50m;
    ssl_session_tickets off;

    # OCSP Stapling (Fast SSL Handshake Verification)
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Production Hardened Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Payload & Buffer Limits
    client_max_body_size 15M;
    client_body_buffer_size 512k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    # Proxy Buffer Tuning
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    proxy_temp_file_write_size 256k;

    # Default Proxy Headers
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # --------------------------------------------------------------------------
    # 2.1 Public Career Application Endpoint Protection (Rate Limited)
    # PRD Bab 6.1: Maksimal 5 permintaan unggah per menit per client IP
    # --------------------------------------------------------------------------
    location ~* ^/api/careers/[0-9]+/apply$ {
        limit_req zone=talentops_apply_limit burst=2 nodelay;

        proxy_pass http://talentops_backend_cluster;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # 2.2 Server-Sent Events (SSE) Trace Stream Unbuffered Endpoints
    # PRD Bab 1.2, 5.3 & 8.2: Zero buffering, persistent keep-alive stream
    # --------------------------------------------------------------------------
    location ~* ^/api/candidates/(stream/[0-9]+|[0-9]+/trace-stream)$ {
        limit_req zone=talentops_api_limit burst=10 nodelay;

        proxy_pass http://talentops_backend_cluster;

        # Disable all proxy and client buffering for real-time streaming
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # Keep connection open for long-lived SSE sessions (5 minutes timeout)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;

        # Clear Connection header to maintain persistent upstream keepalive
        proxy_set_header Connection "";
        proxy_set_header Cache-Control "no-cache";
        proxy_set_header X-Accel-Buffering "no";
    }

    # --------------------------------------------------------------------------
    # 2.3 General API Endpoints & Swagger /docs
    # --------------------------------------------------------------------------
    location / {
        limit_req zone=talentops_api_limit burst=20 nodelay;

        proxy_pass http://talentops_backend_cluster;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    # Custom Error Pages for Graceful Degradation
    error_page 429 /429.json;
    location = /429.json {
        default_type application/json;
        return 429 '{"status":"error","code":"RATE_LIMIT_EXCEEDED","message":"Terlalu banyak permintaan. Silakan tunggu beberapa saat."}';
    }

    error_page 502 503 504 /50x.json;
    location = /50x.json {
        default_type application/json;
        return 503 '{"status":"error","code":"SERVICE_UNAVAILABLE","message":"Backend TalentOps AI sedang sibuk atau dalam pemeliharaan berkala."}';
    }
}
